version: '3.8'

services:
  # ===========================================
  # INFRASTRUCTURE SERVICES
  # ===========================================
  
  # Configuration Server
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native,docker
    volumes:
      - ./config-repo:/app/config-repo:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Service Discovery
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================
  # DATABASES
  # ===========================================
  
  # MySQL for Offre Service
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: offre_db
      MYSQL_USER: offre_user
      MYSQL_PASSWORD: offre_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL for Candidature Service
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: candidature_db
      POSTGRES_USER: candidature_user
      POSTGRES_PASSWORD: candidature_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidature_user -d candidature_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================
  # MESSAGE BROKER
  # ===========================================
  
  # RabbitMQ for Async Communication
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================
  # SECURITY
  # ===========================================
  
  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: true
    ports:
      - "8180:8180"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./docker/keycloak/themes:/opt/keycloak/themes
      - keycloak_data:/opt/keycloak/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8180'"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ===========================================
  # MICROSERVICES
  # ===========================================
  
  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - microservices-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Auth Service (Node.js)
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8083:8083"
    networks:
      - microservices-network
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8083
      - KEYCLOAK_URL=http://keycloak:8180
      - KEYCLOAK_REALM=microservices-realm
      - KEYCLOAK_CLIENT_ID=auth-service-client
      - KEYCLOAK_CLIENT_SECRET=S3cr3t-Auth-S3rv1c3-K3y-2024
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./auth-service/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Offre Service
  offre-service:
    build: ./offre-service
    container_name: offre-service
    ports:
      - "8081:8081"
    networks:
      - microservices-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Candidature Service
  candidature-service:
    build: ./candidature-service-nodejs
    container_name: candidature-service
    ports:
      - "8082:8082"
    networks:
      - microservices-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      offre-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8082
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=candidature_db
      - DB_USER=candidature_user
      - DB_PASSWORD=candidature_password
      - EUREKA_HOST=eureka-server
      - EUREKA_PORT=8761
      - KEYCLOAK_URL=http://keycloak:8180
      - KEYCLOAK_REALM=microservices-realm
      - OFFRE_SERVICE_URL=http://offre-service:8081
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================
  # FRONTEND
  # ===========================================
  
  # Frontend (React/Vue)
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:8080
        REACT_APP_KEYCLOAK_URL: http://localhost:8180
        REACT_APP_KEYCLOAK_REALM: microservices-realm
        REACT_APP_KEYCLOAK_CLIENT_ID: frontend-client
    container_name: frontend
    ports:
      - "3000:80"
    networks:
      - microservices-network
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8080
      - REACT_APP_KEYCLOAK_URL=http://localhost:8180
      - REACT_APP_KEYCLOAK_REALM=microservices-realm
      - REACT_APP_KEYCLOAK_CLIENT_ID=frontend-client

# ===========================================
# NETWORKS & VOLUMES
# ===========================================

networks:
  microservices-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  keycloak_data:
    driver: local
