name: CI

on:
  push:
    branches:
      - main
      - master
      - micro
  pull_request:

jobs:
  build:
    name: Build and validate services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Eureka Server
        run: mvn -f eureka-server/pom.xml clean package -DskipTests

      - name: Build Config Server
        run: mvn -f config-server/pom.xml clean package -DskipTests

      - name: Build API Gateway
        run: mvn -f api-gateway/pom.xml clean package -DskipTests

      - name: Build Offre Service
        run: mvn -f offre-service/pom.xml clean package -DskipTests

      - name: Install Auth Service
        working-directory: auth-service
        run: npm install

      - name: Install Candidature Service
        working-directory: candidature-service-nodejs
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Validate Docker Compose config
        run: docker compose -f docker/complete-stack.yml config

      - name: Check Kubernetes YAML files
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path("k8s").glob("*.yaml")):
              docs = list(yaml.safe_load_all(path.read_text()))
              docs = [doc for doc in docs if doc]
              if not docs:
                  raise SystemExit(f"{path} is empty")
              for doc in docs:
                  if "apiVersion" not in doc or "kind" not in doc or "metadata" not in doc:
                      raise SystemExit(f"{path} contains an invalid Kubernetes document")
              print(f"validated {path}")
          PY
