apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: job-portal
data:
  SPRING_PROFILES_ACTIVE: docker
  KEYCLOAK_REALM: microservices-realm
  KEYCLOAK_URL: http://keycloak:8180
  KEYCLOAK_BASE_URL: http://keycloak:8180
  EUREKA_HOST: eureka-server
  EUREKA_PORT: "8761"
  OFFRE_SERVICE_URL: http://offre-service:8081
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-repo
  namespace: job-portal
data:
  api-gateway.yml: |
    server:
      port: 8080

    spring:
      application:
        name: api-gateway
      cloud:
        gateway:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - JwtRelay
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth,/api/auth/**
            - id: offre-service
              uri: lb://offre-service
              predicates:
                - Path=/api/offres,/api/offres/**
            - id: candidature-service
              uri: lb://candidature-service
              predicates:
                - Path=/api/candidatures,/api/candidatures/**
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8180/realms/microservices-realm
              jwk-set-uri: http://keycloak:8180/realms/microservices-realm/protocol/openid-connect/certs

    eureka:
      client:
        service-url:
          defaultZone: http://eureka-server:8761/eureka/
        register-with-eureka: true
        fetch-registry: true

    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
  offre-service.yml: |
    server:
      port: 8081

    spring:
      application:
        name: offre-service
      datasource:
        url: jdbc:mysql://mysql:3306/offre_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        username: offre_user
        password: offre_password
        driver-class-name: com.mysql.cj.jdbc.Driver
      jpa:
        hibernate:
          ddl-auto: update
      rabbitmq:
        host: rabbitmq
        port: 5672
        username: guest
        password: guest
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8180/realms/microservices-realm
              jwk-set-uri: http://keycloak:8180/realms/microservices-realm/protocol/openid-connect/certs

    eureka:
      client:
        service-url:
          defaultZone: http://eureka-server:8761/eureka/
        register-with-eureka: true
        fetch-registry: true

    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
  eureka-server.yml: |
    server:
      port: 8761

    spring:
      application:
        name: eureka-server

    eureka:
      client:
        register-with-eureka: false
        fetch-registry: false
        service-url:
          defaultZone: http://eureka-server:8761/eureka/
      server:
        enable-self-preservation: false

    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
  auth-service.yml: |
    server:
      port: 8083

    spring:
      application:
        name: auth-service

    eureka:
      client:
        service-url:
          defaultZone: http://eureka-server:8761/eureka/
        register-with-eureka: true
        fetch-registry: true

    keycloak:
      realm: microservices-realm
      auth-server-url: http://keycloak:8180
      admin-username: admin
      admin-password: admin
      client-id: auth-service-client
      client-secret: S3cr3t-Auth-S3rv1c3-K3y-2024
  candidature-service.yml: |
    server:
      port: 8082

    spring:
      application:
        name: candidature-service

    eureka:
      client:
        service-url:
          defaultZone: http://eureka-server:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: job-portal
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_password
  MYSQL_DATABASE: offre_db
  MYSQL_USER: offre_user
  MYSQL_PASSWORD: offre_password
  POSTGRES_DB: candidature_db
  POSTGRES_USER: candidature_user
  POSTGRES_PASSWORD: candidature_password
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: Admin@2024
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
