apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidature-service
  namespace: job-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: candidature-service
  template:
    metadata:
      labels:
        app: candidature-service
    spec:
      containers:
        - name: candidature-service
          image: job-portal/candidature-service-nodejs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: NODE_ENV
              value: docker
            - name: PORT
              value: "8082"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: candidature-service
  namespace: job-portal
spec:
  selector:
    app: candidature-service
  ports:
    - port: 8082
      targetPort: 8082
---
