apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: job-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: job-portal/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: NODE_ENV
              value: docker
            - name: PORT
              value: "8083"
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: http://eureka-server:8761/eureka
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: job-portal
spec:
  selector:
    app: auth-service
  ports:
    - port: 8083
      targetPort: 8083
---
