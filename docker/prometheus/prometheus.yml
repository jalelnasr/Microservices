global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080

  - job_name: offre-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - offre-service:8081

  - job_name: candidature-service-nodejs
    metrics_path: /metrics
    static_configs:
      - targets:
          - candidature-service:8082

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eureka-server:8761

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8888
